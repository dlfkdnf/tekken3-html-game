<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tekken 3 - 3D Fighting Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #1a1a1a;
            color: #fff;
            overflow: hidden;
        }

        #gameContainer {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        #hud {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            display: flex;
            justify-content: space-between;
            z-index: 100;
            font-size: 18px;
        }

        .player-info {
            background: rgba(0, 0, 0, 0.7);
            padding: 15px 25px;
            border: 2px solid #00ff00;
            min-width: 250px;
        }

        .player-info.p2 {
            border-color: #ff0000;
            text-align: right;
        }

        .player-name {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .health-bar {
            width: 200px;
            height: 30px;
            background: #333;
            border: 2px solid #666;
            position: relative;
            margin: 10px 0;
            overflow: hidden;
        }

        .health-fill {
            height: 100%;
            background: linear-gradient(90deg, #00ff00, #00aa00);
            transition: width 0.1s;
        }

        .player-info.p2 .health-bar {
            margin-left: auto;
        }

        .player-info.p2 .health-fill {
            background: linear-gradient(90deg, #ff0000, #aa0000);
        }

        .health-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-weight: bold;
            font-size: 14px;
            z-index: 10;
        }

        .status-panel {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border: 2px solid #ffff00;
            text-align: center;
            min-width: 300px;
        }

        .controls {
            position: absolute;
            bottom: 20px;
            right: 20px;
            background: rgba(0, 0, 0, 0.8);
            padding: 15px;
            border: 2px solid #00ffff;
            font-size: 12px;
            max-width: 250px;
        }

        .controls h4 {
            margin-bottom: 10px;
            color: #00ffff;
        }

        .controls p {
            margin: 5px 0;
        }

        #startScreen {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            text-align: center;
        }

        #startScreen h1 {
            font-size: 60px;
            color: #ff0000;
            margin-bottom: 30px;
            text-shadow: 0 0 20px #ff0000;
        }

        #startScreen p {
            font-size: 20px;
            margin: 10px 0;
        }

        #startButton {
            margin-top: 30px;
            padding: 15px 40px;
            font-size: 20px;
            background: #ff0000;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: all 0.3s;
        }

        #startButton:hover {
            background: #cc0000;
            transform: scale(1.1);
        }

        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="gameContainer">
        <div id="startScreen">
            <h1>TEKKEN 3</h1>
            <p>3D Fighting Game</p>
            <p style="font-size: 14px; color: #aaa;">플레이어 1 vs 플레이어 2</p>
            <button id="startButton">게임 시작</button>
        </div>

        <div id="hud">
            <div class="player-info p1">
                <div class="player-name">Player 1</div>
                <div class="health-bar">
                    <div class="health-fill" id="p1Health"></div>
                    <div class="health-text" id="p1HealthText">100/100</div>
                </div>
            </div>
            <div class="player-info p2">
                <div class="player-name">Player 2</div>
                <div class="health-bar">
                    <div class="health-fill" id="p2Health"></div>
                    <div class="health-text" id="p2HealthText">100/100</div>
                </div>
            </div>
        </div>

        <div class="status-panel">
            <div id="gameStatus">준비중...</div>
        </div>

        <div class="controls">
            <h4>컨트롤</h4>
            <p><strong>플레이어 1:</strong></p>
            <p>↑↓←→ - 이동</p>
            <p>Z - 약 공격</p>
            <p>X - 강 공격</p>
            <p><strong>플레이어 2:</strong></p>
            <p>W/A/S/D - 이동</p>
            <p>O - 약 공격</p>
            <p>P - 강 공격</p>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="js/game.js"></script>
</body>
</html>
